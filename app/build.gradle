//                def baseApkName = packageName +
//                        "_v" + defaultConfig.versionName + "beta" +
//                        "_" + variant.productFlavors[0].name +
//                        "_" + new Date().format('yyyyMMddHHmm') +
//                        '.apk'
//                output.outputFile = new File(oldFile.parent, baseApkName)
//            }
//            if (variant.buildType.name.equals('debug')) {
//
//            }
//        }
//    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = applicationId +
                    "_v" + defaultConfig.versionName +
                    "_" + variant.productFlavors[0].name +
                    "_" + new Date().format('yyyyMMddHHmm') +
                    '.apk'
        }
    }
}

dependencies {
    implementation project(':androidutils')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    /**
     * Ads Start
     */
    //友盟统计 (umeng analytics). In the v9+ layout MobclickAgent ships inside the
    //common artifact (there is no separate analytics module), and init is
    //explicit via UMConfigure; see ZAdsApplication.
    implementation 'com.umeng.umsdk:common:10.0.1'
    //Facebook广告
//    implementation files('libs/AudienceNetwork_v4.7.jar')
//    implementation 'com.facebook.android:audience-network-sdk:4.+'
    implementation('com.facebook.android:audience-network-sdk:6.17.0') {
        exclude group: 'com.google.android.exoplayer', module: 'exoplayer'
    }
    //AdMob广告
    implementation 'com.google.android.gms:play-services-ads:22.6.0'
    //ZAds SDK
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    /**
     * Ads End
     */

    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Pins transitive AndroidX components to versions that are compiled against
    // API 34+. Resolves the "dependency was compiled against a newer version of
    // the Android APIs" build error that the ad SDKs otherwise trigger at minSdk 21.
    implementation 'androidx.collection:collection:1.4.4'
    implementation 'androidx.fragment:fragment:1.8.5'

}
