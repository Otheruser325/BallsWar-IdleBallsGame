apply plugin: 'com.android.application'
//apply plugin: 'com.antfortune.freeline'

// Ad provider keys are not compiled in from source. They are read from
// local.properties (not version controlled) or the environment, falling back to
// the values published in this sample project. Release builds can therefore be
// pointed at different accounts without editing Java.
def adProp = { String key, String fallback ->
    def value = project.findProperty(key) ?: System.getenv(key) ?: fallback
    return value
}

android {
    namespace = 'com.cpxiao'
    compileSdk = 35

    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "com.cpxiao.idleballz"
        minSdk = 21
        targetSdk = 35
        versionCode 206
        versionName "2.0.6"
        flavorDimensions "channel"

        buildConfigField "String", "UMENG_APPKEY", "\"${adProp('umeng.appkey', '59cdeddfbbea8361b9000011')}\""
        // Google's published AdMob test application ID. The production app id for
        // this project was never committed, so override it in local.properties:
        //   admob.applicationId=ca-app-pub-<publisher>~<appid>
        buildConfigField "String", "ADMOB_APPLICATION_ID", "\"${adProp('admob.applicationId', 'ca-app-pub-3940256099942544~3347511713')}\""
        buildConfigField "String", "ADMOB_BANNER_UNIT_ID", "\"${adProp('admob.bannerUnitId', 'ca-app-pub-4157365005379790/2632993970')}\""
        buildConfigField "String", "ADMOB_REWARDED_UNIT_ID", "\"${adProp('admob.rewardedUnitId', 'ca-app-pub-4157365005379790/2408405335')}\""
        buildConfigField "String", "FB_BANNER_PLACE_ID", "\"${adProp('fb.bannerPlaceId', '2090519740961758_2090523687628030')}\""

        manifestPlaceholders = [
                ADMOB_APPLICATION_ID: adProp('admob.applicationId', 'ca-app-pub-3940256099942544~3347511713'),
                UMENG_APPKEY        : adProp('umeng.appkey', '59cdeddfbbea8361b9000011'),
        ]
    }

    buildTypes {
        release {
            minifyEnabled true  //混淆
            shrinkResources = true // 移除无用的resource文件
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    productFlavors {
        gp {}
    }

    productFlavors.all {
        flavor -> flavor.manifestPlaceholders = [UMENG_CHANNEL_VALUE: name]
    }

//    freeline {
//        hack true
//        productFlavor 'debug_gp'
//    }

    //修改生成的apk名字
